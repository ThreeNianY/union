<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>页面不存在 · 潮汐聚澜工会</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: linear-gradient(135deg, #0c7bb3 0%, #085a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
    .wrap { text-align: center; padding: 40px 20px; max-width: 480px; }
    .code { font-size: 120px; font-weight: 900; line-height: 1; opacity: .25; margin-bottom: 10px; letter-spacing: 8px; }
    h1 { font-size: 26px; margin-bottom: 12px; }
    p { font-size: 15px; opacity: .9; margin-bottom: 28px; line-height: 1.7; }
    .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 11px 28px; border-radius: 30px; font-size: 15px; text-decoration: none; transition: transform .2s, box-shadow .2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
    .btn-primary { background: #fff; color: #0c7bb3; font-weight: bold; }
    .btn-ghost { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>你访问的页面好像被潮汐冲走了。<br />检查一下网址，或者回到首页重新找路。</p>
    <div class="btns">
      <a class="btn btn-primary" href="/">返回首页</a>
      <a class="btn btn-ghost" href="/member/">成员专区</a>
    </div>
  </div>
</body>
</html>
