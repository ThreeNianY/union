<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成员专区 · 潮汐聚澜工会</title>
  <style>
    /* ========== 全局设计变量 ========== */
    :root {
      --blue: #0c7bb3; --blue-dark: #085a8a; --cyan: #4dd0e1; --gold: #e8b84b;
      --text: #2a3a44; --gray: #5d7079; --bg: #ffffff; --bg-soft: #f0f7fb;
      --shadow: 0 6px 20px rgba(12, 123, 179, .12); --radius: 12px; --danger: #c0392b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--text); line-height: 1.7; background: var(--bg); }
    a { text-decoration: none; color: inherit; }
    section { padding: 60px 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .sec-title { text-align: center; font-size: 30px; margin-bottom: 12px; }
    .sec-title span { color: var(--blue); }
    .sec-sub { text-align: center; color: var(--gray); margin-bottom: 45px; }
    .hidden { display: none !important; }
    .activities { background: var(--bg-soft); }

    /* 顶部导航（简化版） */
    header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.95); box-shadow: var(--shadow); }
    .nav { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
    .logo { font-size: 20px; font-weight: bold; color: var(--blue); }
    .logo small { color: var(--gray); font-size: 12px; font-weight: normal; }
    /* 返回主页按钮：导航栏右侧圆形回箭头 */
    .back-home { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-soft); color: var(--blue); font-size: 22px; line-height: 1; transition: background .2s, transform .2s; }
    .back-home:hover { background: #d7eaf5; transform: translateX(-2px); }

    /* 密码验证卡片 */
    .gate { max-width: 380px; margin: 90px auto; background: #fff; border-radius: var(--radius); padding: 40px 32px; box-shadow: var(--shadow); text-align: center; }
    .gate h2 { font-size: 22px; margin-bottom: 6px; }
    .gate .tip { color: var(--gray); font-size: 14px; margin-bottom: 20px; }
    .gate input { width: 100%; padding: 11px 14px; border: 1px solid #cfe0ea; border-radius: 8px; font-size: 15px; font-family: inherit; margin-bottom: 6px; }
    .gate input:focus { outline: none; border-color: var(--blue); }
    .gate .err { color: var(--danger); font-size: 13px; min-height: 20px; }
    .gate .btn { width: 100%; margin-top: 8px; display: inline-block; padding: 10px 22px; border-radius: 30px; background: var(--blue); color: #fff; border: none; cursor: pointer; font-size: 15px; font-family: inherit; }
    .gate .btn:hover { background: var(--blue-dark); }

    /* 成员公告 */
    .notice-box { max-width: 720px; margin: 0 auto; background: #fff; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border-left: 5px solid var(--blue); }
    .notice-box .meta { font-size: 13px; color: var(--gray); margin-bottom: 14px; }
    .notice-box .content { white-space: pre-wrap; font-size: 15px; line-height: 1.9; }
    .notice-empty { text-align: center; color: var(--gray); padding: 24px; }

    /* 网页导航卡片 */
    .nav-links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 900px; margin: 0 auto; }
    .nav-card { background: #fff; border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); transition: transform .25s; border-top: 4px solid var(--cyan); }
    .nav-card:hover { transform: translateY(-5px); }
    .nav-card h3 { font-size: 17px; margin-bottom: 6px; }
    .nav-card p { font-size: 14px; color: var(--gray); margin-bottom: 12px; }
    .nav-card a.visit { display: inline-block; padding: 7px 18px; border-radius: 20px; background: var(--blue); color: #fff; font-size: 13px; transition: background .2s; }
    .nav-card a.visit:hover { background: var(--blue-dark); }

    /* 成员名录（按部门分组） */
    .roster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; max-width: 900px; margin: 0 auto; }
    .roster-dept { background: #fff; border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); border-top: 4px solid var(--blue); }
    .roster-dept:nth-child(2) { border-top-color: var(--cyan); }
    .roster-dept:nth-child(3) { border-top-color: var(--gold); }
    .roster-dept:nth-child(4) { border-top-color: #7e57c2; }
    /* 管理层卡片：金色边框、横跨整行、置顶显示 */
    .roster-dept.mgmt { border-top-color: var(--gold); grid-column: 1 / -1; background: linear-gradient(180deg, #fffdf5, #fff); }
    .roster-dept.mgmt li { border-bottom-color: #f5ecd4; }
    .roster-dept.mgmt .badge { display: inline-block; background: var(--gold); color: #5a3d00; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-right: 8px; font-weight: bold; }
    .roster-dept h3 { font-size: 17px; margin-bottom: 10px; }
    .roster-dept .count { font-size: 12px; color: var(--gray); font-weight: normal; margin-left: 6px; }
    .roster-dept ul { list-style: none; }
    .roster-dept li { font-size: 14px; padding: 5px 0; border-bottom: 1px dashed #edf2f6; display: flex; justify-content: space-between; gap: 10px; }
    .roster-dept li:last-child { border-bottom: none; }
    .roster-dept li .srv { color: var(--gray); font-size: 12px; white-space: nowrap; }
    .roster-empty { color: var(--gray); font-size: 13px; padding: 6px 0; }

    /* 提议箱表单 */
    .suggest-form { max-width: 560px; margin: 0 auto; background: #fff; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #cfe0ea; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--blue); }
    .suggest-form .btn { display: inline-block; padding: 10px 26px; border-radius: 30px; background: var(--blue); color: #fff; border: none; cursor: pointer; font-size: 15px; font-family: inherit; }
    .suggest-form .btn:hover { background: var(--blue-dark); }

    /* 页脚 */
    footer { background: #142a36; color: #9fb3bf; text-align: center; padding: 28px 20px; font-size: 14px; }

    @media (max-width: 900px) { .nav-links-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .nav-links-grid { grid-template-columns: 1fr; } .roster-grid { grid-template-columns: 1fr; } .gate { margin: 50px auto; } }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <nav class="nav">
      <div style="display:flex;align-items:center;gap:12px;">
        <a class="back-home" href="../index.html" title="返回主页">←</a>
        <div class="logo">潮汐聚澜 <small>成员专区</small></div>
      </div>
    </nav>
  </header>

  <!-- 密码验证（未解锁时显示） -->
  <div class="gate" id="gate">
    <h2>成员专区</h2>
    <p class="tip">仅限工会成员访问，请输入成员密码</p>
    <form id="gateForm">
      <input type="password" name="pwd" placeholder="请输入成员密码" autocomplete="off" required />
      <p class="err" id="gateErr"></p>
      <button type="submit" class="btn">进入专区</button>
    </form>
  </div>

  <!-- 专区内容（解锁后显示） -->
  <div id="memberContent" class="hidden">
    <!-- 成员公告 -->
    <section id="notice" class="activities" style="padding-top:60px;">
      <div class="container">
        <h2 class="sec-title">成员<span>公告</span></h2>
        <p class="sec-sub">工会最新通知与内部资讯</p>
        <div class="notice-box" id="noticeBox"><p class="notice-empty">加载中...</p></div>
      </div>
    </section>

    <!-- 工会规则 -->
    <section id="rules">
      <div class="container">
        <h2 class="sec-title">工会<span>规则</span></h2>
        <p class="sec-sub">全体成员共同遵守，共建和谐工会</p>
        <div class="notice-box" id="rulesBox"><p class="notice-empty">加载中...</p></div>
      </div>
    </section>

    <!-- 服务器信息 -->
    <section id="servers" class="activities">
      <div class="container">
        <h2 class="sec-title">服务器<span>信息</span></h2>
        <p class="sec-sub">各服务器地址与版本，按此入服不迷路</p>
        <div class="notice-box" id="serversBox"><p class="notice-empty">加载中...</p></div>
      </div>
    </section>

    <!-- 成员名录 -->
    <section id="roster">
      <div class="container">
        <h2 class="sec-title">成员<span>名录</span></h2>
        <p class="sec-sub">按部门分类，找人对口不再难</p>
        <div class="roster-grid" id="rosterGrid"><p class="notice-empty">加载中...</p></div>
      </div>
    </section>

    <!-- 提议箱 -->
    <section id="suggest" class="activities">
      <div class="container">
        <h2 class="sec-title">提议<span>箱</span></h2>
        <p class="sec-sub">对工会有什么想法或建议？提交给管理层</p>
        <form id="suggestForm" class="suggest-form">
          <div class="form-group"><label>你的游戏 ID（选填，不填则匿名）</label><input type="text" name="ign" placeholder="留空则匿名提交" /></div>
          <div class="form-group"><label>建议内容</label><textarea name="content" rows="4" placeholder="写下你的建议或想法..." required></textarea></div>
          <button type="submit" class="btn">提交建议</button>
        </form>
      </div>
    </section>

    <!-- 网页导航 -->
    <section id="memberNav">
      <div class="container">
        <h2 class="sec-title">网页<span>导航</span></h2>
        <p class="sec-sub">工会成员常用站点快捷入口</p>
        <div class="nav-links-grid" id="navLinksGrid"><p class="notice-empty">加载中...</p></div>
      </div>
    </section>
  </div>

  <!-- 页脚 -->
  <footer>
    <p>© 2026 潮汐聚澜工会 | 汇聚潮汐之力，共建温馨工会</p>
  </footer>

  <!-- 公共配置与数据层 -->
  <script src="../config.js"></script>
  <script>
    const gate = document.getElementById('gate');
    const content = document.getElementById('memberContent');
    const gateErr = document.getElementById('gateErr');

    /* ===================== 渲染：成员公告 ===================== */
    async function renderNotice() {
      try {
        const data = await DB.getNotice();
        const box = document.getElementById('noticeBox');
        if (!data.content) { box.innerHTML = '<p class="notice-empty">暂无公告，请留意后续通知。</p>'; return; }
        box.innerHTML = `<div class="meta">发布时间：${esc(data.time || '—')}</div><div class="content">${esc(data.content)}</div>`;
      } catch (e) { document.getElementById('noticeBox').innerHTML = '<p class="notice-empty">加载失败，请稍后刷新重试</p>'; }
    }

    /* ===================== 渲染：网页导航 ===================== */
    async function renderNavLinks() {
      try {
        const links = await DB.getLinks();
        const grid = document.getElementById('navLinksGrid');
        if (!links.length) { grid.innerHTML = '<p class="notice-empty">暂无导航链接。</p>'; return; }
        grid.innerHTML = links.map(l => `<div class="nav-card"><h3>${esc(l.name)}</h3><p>${esc(l.desc || '')}</p><a class="visit" href="${esc(l.url)}" target="_blank" rel="noopener">前往访问</a></div>`).join('');
      } catch (e) { document.getElementById('navLinksGrid').innerHTML = '<p class="notice-empty">加载失败，请稍后刷新重试</p>'; }
    }

    /* ===================== 渲染：工会规则 / 服务器信息 ===================== */
    async function renderSingleBox(getter, boxId, emptyText) {
      try {
        const data = await getter();
        const box = document.getElementById(boxId);
        if (!data.content) { box.innerHTML = `<p class="notice-empty">${emptyText}</p>`; return; }
        box.innerHTML = `<div class="meta">更新时间：${esc(data.time || '—')}</div><div class="content">${esc(data.content)}</div>`;
      } catch (e) { document.getElementById(boxId).innerHTML = '<p class="notice-empty">加载失败，请稍后刷新重试</p>'; }
    }

    /* ===================== 渲染：成员名录（管理层置顶 + 按部门分组） ===================== */
    const DEPTS = ['战斗部门', '建筑部门', '资源部门', '生电部门'];
    async function renderRoster() {
      try {
        const members = await DB.getMembers();
        const grid = document.getElementById('rosterGrid');
        /* 管理层卡片：所有设置了"职务"的成员（会长/副会长/管理员），可同时属于任何部门 */
        const mgmt = members.filter(m => m.role);
        const mgmtCard = `<div class="roster-dept mgmt"><h3>管理层<span class="count">${mgmt.length} 人</span></h3><ul>${
          mgmt.length
            ? mgmt.map(m => {
                /* 兼任部门显示：主部门 + 第二部门 */
                const dl = [m.dept, m.dept2].filter(Boolean).join(' + ');
                return `<li><span><span class="badge">${esc(m.role)}</span>${esc(m.ign)}${dl ? `<span class="srv" style="margin-left:8px;">兼 ${esc(dl)}</span>` : ''}</span><span class="srv">${esc(m.server || '')}</span></li>`;
              }).join('')
            : '<li class="roster-empty">暂无管理层成员</li>'
        }</ul></div>`;
        /* 四个部门卡片：主部门或第二部门命中即显示（实现双重部门）；部门为空的人不显示在任何卡片 */
        const deptCards = DEPTS.map(dept => {
          const list = members.filter(m => m.dept === dept || m.dept2 === dept);
          const items = list.length
            ? list.map(m => `<li><span>${esc(m.ign)}${m.dept && m.dept2 && (m.dept === dept || m.dept2 === dept) ? '<span class="srv" style="margin-left:6px;">双部门</span>' : ''}</span><span class="srv">${esc(m.server || '')}</span></li>`).join('')
            : '<li class="roster-empty">暂无成员</li>';
          return `<div class="roster-dept"><h3>${dept}<span class="count">${list.length} 人</span></h3><ul>${items}</ul></div>`;
        }).join('');
        grid.innerHTML = mgmtCard + deptCards;
      } catch (e) { document.getElementById('rosterGrid').innerHTML = '<p class="notice-empty">加载失败，请稍后刷新重试</p>'; }
    }

    /* ===================== 解锁：隐藏验证卡片，显示专区内容 ===================== */
    async function unlock() {
      gate.classList.add('hidden');
      content.classList.remove('hidden');
      await Promise.all([
        renderNotice(), renderNavLinks(),
        renderSingleBox(DB.getRules, 'rulesBox', '暂无规则，请等待管理员发布。'),
        renderSingleBox(DB.getServers, 'serversBox', '暂无服务器信息，请等待管理员发布。'),
        renderRoster()
      ]);
    }

    /* 本次会话已验证过则直接进入（关闭浏览器后失效） */
    if (sessionStorage.getItem('fr_member') === '1') unlock();

    /* ===================== 密码验证：与云端存储的成员密码比对 ===================== */
    document.getElementById('gateForm').addEventListener('submit', async e => {
      e.preventDefault();
      gateErr.textContent = '';
      try {
        const settings = await DB.getSettings();
        const memberPwd = settings.member_pwd || '';
        if (!memberPwd) { gateErr.textContent = '成员密码尚未设置，请联系管理员'; return; }
        if (e.target.pwd.value === memberPwd) {
          sessionStorage.setItem('fr_member', '1');   /* 记住解锁状态（本次会话内有效） */
          unlock();
        } else { gateErr.textContent = '密码错误，请重试'; }
      } catch (err) { gateErr.textContent = '网络错误，请稍后重试'; }
    });

    /* ===================== 提议箱：提交建议 ===================== */
    document.getElementById('suggestForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const content = this.content.value.trim();
      if (!content) { alert('请填写建议内容'); return; }
      try {
        await DB.addSuggestion({ ign: this.ign.value.trim() || '匿名', content, time: new Date().toLocaleString('zh-CN'), done: false });
        alert('建议提交成功，感谢你的反馈！');
        this.reset();
      } catch (err) { alert('提交失败，请检查网络后重试：' + err.message); }
    });
  </script>
</body>
</html>
